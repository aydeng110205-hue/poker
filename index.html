<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Royale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d0d2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            width: 420px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        .logo { font-size: 64px; margin-bottom: 10px; }
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 20px rgba(247, 151, 30, 0.2);
        }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0e27;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(247, 151, 30, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #ff4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .players-online {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">♠️</div>
        <h1>POKER ROYALE</h1>
        <p class="subtitle">Texas Hold'em</p>
        
        <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20" autocomplete="off">
        <div class="error" id="errorMsg">Please enter a username</div>
        <button class="btn" id="joinBtn" disabled>Join the Table</button>
        
        <div class="players-online" id="statusMsg">Enter a name to get started</div>
    </div>

    <script>
        const input = document.getElementById('usernameInput');
        const btn = document.getElementById('joinBtn');
        const error = document.getElementById('errorMsg');
        const status = document.getElementById('statusMsg');

        input.addEventListener('input', () => {
            const name = input.value.trim();
            btn.disabled = name.length === 0;
            error.style.display = 'none';
            if (name.length > 0) {
                status.textContent = `Ready to play as "${name}"`;
                status.style.color = 'rgba(255,255,255,0.6)';
            } else {
                status.textContent = 'Enter a name to get started';
                status.style.color = 'rgba(255,255,255,0.3)';
            }
        });

        btn.addEventListener('click', () => {
            const name = input.value.trim();
            if (!name) {
                error.style.display = 'block';
                return;
            }
            localStorage.setItem('poker_username', name);
            status.textContent = `Welcome, ${name}! Game coming soon...`;
            btn.textContent = 'Entering...';
            btn.disabled = true;
            // In the future, this will redirect to the game lobby
            setTimeout(() => {
                alert(`Welcome to the table, ${name}! The full game is coming soon.`);
                btn.textContent = 'Join the Table';
                btn.disabled = false;
            }, 500);
        });

        // Check if already have a name stored
        const saved = localStorage.getItem('poker_username');
        if (saved) {
            input.value = saved;
            btn.disabled = false;
            status.textContent = `Welcome back, ${saved}!`;
            status.style.color = 'rgba(255,255,255,0.6)';
        }
    </script>
</body>
</html>
