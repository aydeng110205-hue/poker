<!DOCTYPE html>
<html>
<head>
  <title>Poker Royale - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .container{max-width:400px;width:100%;padding:20px;text-align:center;}
    .logo{font-size:60px;margin-bottom:16px;}
    h1{font-size:40px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#eab308,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
    .sub{color:rgba(255,255,255,0.4);margin-bottom:24px;font-size:14px;}
    .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
    .input{width:100%;padding:12px 16px;font-size:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;}
    .input:focus{border-color:rgba(245,158,11,0.5);}
    .btn{width:100%;padding:12px;font-size:14px;font-weight:600;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#f59e0b,#eab308);color:#0a0a0f;font-family:'Inter',sans-serif;}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,0.4);}
    .tabs{display:flex;gap:8px;margin-bottom:20px;}
    .tab{flex:1;padding:10px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-family:'Inter',sans-serif;}
    .tab.active{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.2);}
    .form{display:none;flex-direction:column;gap:0;}
    .form.active{display:flex;}
    .error{color:#ef4444;font-size:13px;margin-bottom:12px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">♦️</div>
    <h1>POKER ROYALE</h1>
    <p class="sub">Real-time Texas Hold'em Multiplayer</p>
    <div class="glass">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>
      <div id="loginForm" class="form active">
        <input type="text" id="loginUser" class="input" placeholder="Username" autocomplete="off">
        <input type="password" id="loginPass" class="input" placeholder="Password">
        <div id="loginError" class="error" style="display:none;"></div>
        <button class="btn" onclick="login()">Sign In</button>
      </div>
      <div id="registerForm" class="form">
        <input type="text" id="regUser" class="input" placeholder="Username (3-20 chars)" autocomplete="off">
        <input type="password" id="regPass" class="input" placeholder="Password (4+ chars)">
        <div id="regError" class="error" style="display:none;"></div>
        <button class="btn" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('err');
    if (err === 'invalid') showError('login', 'Invalid username/password');
    else if (err === 'taken') showError('reg', 'Username already taken');
    else if (err === 'auth') showError('login', 'Invalid credentials');

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelector('.tabs button:first-child').classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelector('.tabs button:last-child').classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    function showError(form, msg) {
      const el = document.getElementById(form + 'Error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function login() {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      if (!u || !p) return showError('login', 'Fill in all fields');
      const form = new FormData();
      form.append('username', u);
      form.append('password', p);
      const res = await fetch('/api/login', { method: 'POST', body: new URLSearchParams(form) });
      if (res.redirected) window.location.href = res.url;
    }

    async function register() {
      const u = document.getElementById('regUser').value;
      const p = document.getElementById('regPass').value;
      if (!u || !p) return showError('reg', 'Fill in all fields');
      if (u.length < 3) return showError('reg', 'Username too short');
      if (p.length < 4) return showError('reg', 'Password too short');
      const form = new FormData();
      form.append('username', u);
      form.append('password', p);
      const res = await fetch('/api/register', { method: 'POST', body: new URLSearchParams(form) });
      if (res.redirected) window.location.href = res.url;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').classList.contains('active')) login();
        else register();
      }
    });
  </script>
</body>
</html>
